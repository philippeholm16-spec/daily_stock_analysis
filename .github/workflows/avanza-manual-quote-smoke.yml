name: Avanza MCP manual quote smoke test

on:
  workflow_dispatch:
    inputs:
      order_book_id:
        description: 'Verified numeric Avanza order-book ID (not ticker)'
        required: true
        type: string

permissions:
  contents: read

jobs:
  quote-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install standalone MCP dependency
        run: python -m pip install avanza-mcp
      - name: Run one read-only quote diagnostic
        env:
          ORDER_BOOK_ID: ${{ inputs.order_book_id }}
        run: python -m scripts.avanza_mcp_bridge --order-book-id "$ORDER_BOOK_ID"
      - name: Upload diagnostic result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: avanza-quote-diagnostic
          path: avanza_diagnostic.json
          if-no-files-found: ignore
          retention-days: 1
