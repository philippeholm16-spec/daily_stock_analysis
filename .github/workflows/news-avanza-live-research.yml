name: News and Avanza live research diagnostic
on:
  push:
    branches: [feature/swedish-market-scanner]
    paths:
      - 'scripts/news_avanza_research_probe.py'
      - 'src/news_company_research.py'
      - '.github/workflows/news-avanza-live-research.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-data-only:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install read-only public quote client
        run: python -m pip install 'git+https://github.com/AnteWall/avanza-mcp.git'
      - name: Run public RSS and stock identity research, no trades
        run: python -m scripts.news_avanza_research_probe
