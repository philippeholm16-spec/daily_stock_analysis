name: Placera public RSS one-shot diagnostic

on:
  push:
    branches:
      - feature/swedish-market-scanner
    paths:
      - '.github/workflows/placera-rss-smoke.yml'
      - 'scripts/public_rss_probe.py'
      - 'src/news_first_discovery.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  one-feed:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Read one public Placera RSS feed, headlines only
        run: python -m scripts.public_rss_probe --source placera
