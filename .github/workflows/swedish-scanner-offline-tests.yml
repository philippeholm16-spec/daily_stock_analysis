name: Swedish scanner offline validation

on:
  push:
    branches:
      - feature/swedish-market-scanner
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install isolated test dependencies
        run: python -m pip install pytest
      - name: Compile scanner modules
        run: python -m py_compile src/swedish_market_scanner.py src/swedish_fundamental_weekly_score.py src/swedish_revision_momentum.py src/swedish_investment_due_diligence.py scripts/weekly_revision_audit.py src/swedish_revision_quality.py scripts/review_swedish_revisions.py scripts/weekly_value_board.py src/swedish_market_universe.py src/avanza_mcp_adapter.py src/avanza_batch_quality.py src/swedish_stock_news.py src/news_first_discovery.py src/swedish_news_sources.py src/news_headline_watchlist.py src/news_market_join.py src/news_company_research.py src/automatic_news_candidates.py src/technical_price_levels.py src/stockholm_stock_analyst.py src/stockholm_walkforward.py src/stockholm_realtime_quality.py src/ibkr_exchange_provenance.py src/ibkr_contract_identity.py src/ibkr_book_corroboration.py src/stockholm_realtime_entry_recheck.py src/stockholm_live_alert.py src/ibkr_tws_quote_adapter.py scripts/ibkr_local_live_probe.py scripts/ibkr_contract_lookup.py scripts/ibkr_one_stock_preflight.py src/stockholm_universe_batch.py src/discovery_watch_alerts.py src/news_source_diversity.py src/google_swedish_news.py src/complete_market_coverage.py src/proposal_independent_review.py src/research_alert_review.py src/telegram_research_digest.py scripts/telegram_research_delivery.py scripts/audit_stockholm_universe.py scripts/avanza_full_market.py scripts/stockholm_market_batch_research.py scripts/news_avanza_research_probe.py scripts/auto_news_research_probe.py scripts/avanza_mcp_bridge.py
      - name: Run offline validation tests
        run: python -m pytest --noconftest -q tests/test_swedish_market_scanner.py tests/test_swedish_fundamental_weekly_score.py tests/test_swedish_revision_momentum.py tests/test_swedish_revision_quality.py tests/test_swedish_market_universe.py tests/test_avanza_mcp_adapter.py tests/test_avanza_real_response_mapping.py tests/test_avanza_batch_quality.py tests/test_swedish_stock_news.py tests/test_news_first_discovery.py tests/test_swedish_news_sources.py tests/test_news_headline_watchlist.py tests/test_news_market_join.py tests/test_news_company_research.py tests/test_automatic_news_candidates.py tests/test_technical_price_levels.py tests/test_stockholm_stock_analyst.py tests/test_stockholm_walkforward.py tests/test_stockholm_realtime_quality.py tests/test_ibkr_exchange_provenance.py tests/test_ibkr_contract_identity.py tests/test_ibkr_contract_lookup.py tests/test_ibkr_book_corroboration.py tests/test_ibkr_contract_lookup_integration.py tests/test_ibkr_one_stock_preflight.py tests/test_ibkr_readonly_safety.py tests/test_ibkr_local_live_probe_integration.py tests/test_stockholm_realtime_entry_recheck.py tests/test_stockholm_live_alert.py tests/test_stockholm_universe_batch.py tests/test_stockholm_market_batch_research.py tests/test_auto_news_research_integration.py tests/test_news_source_diversity.py tests/test_cash_and_risk_budget.py tests/test_google_swedish_news.py tests/test_complete_market_coverage.py tests/test_proposal_independent_review.py tests/test_research_alert_review.py tests/test_telegram_research_delivery.py tests/test_full_market_reference_requirement.py
      - name: Reproduce source-linked October 2026 week 43 investment watchlist (NOT trade signals)
        run: python -m scripts.weekly_value_board --file data/swedish_research_2026_w43.json --as-of 2026-10-22T12:00:00+02:00 --output week43_research_scores.json
      - name: Archive scored research as non-actionable artifact
        uses: actions/upload-artifact@v4
        with:
          name: xsto-week43-2026-fundamental-research
          path: week43_research_scores.json
          retention-days: 7
          if-no-files-found: error
      - name: Audit Elekta target and EPS revision evidence WITHOUT granting a buy signal
        run: python -m scripts.review_swedish_revisions --file data/elekta_analyst_revisions_2026_10_22.json --as-of 2026-10-22T12:40:00Z --output elekta_revision_audit.json
      - name: Archive Elekta critical diligence gaps
        uses: actions/upload-artifact@v4
        with:
          name: elekta-2026-10-22-analyst-revision-audit
          path: elekta_revision_audit.json
          retention-days: 7
          if-no-files-found: error
      - name: Reproduce corrected broker revision and short interest audit without buy-score
        run: python -m scripts.weekly_revision_audit --file data/swedish_revision_evidence_2026_w43.json --as-of 2026-10-22T14:40:00+02:00 --output revised_investment_research_2026_w43.json
      - name: Archive revised research with hard blockers for missing EPS and fundamental evidence
        uses: actions/upload-artifact@v4
        with:
          name: xsto-week43-2026-revision-due-diligence-NO-BUY
          path: revised_investment_research_2026_w43.json
          retention-days: 7
          if-no-files-found: error
