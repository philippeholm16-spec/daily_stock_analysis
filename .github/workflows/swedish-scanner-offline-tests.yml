name: Swedish scanner offline validation

on:
  push:
    branches:
      - feature/swedish-market-scanner
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install isolated test dependencies
        run: python -m pip install pytest
      - name: Compile scanner modules
        run: python -m py_compile src/swedish_market_scanner.py src/swedish_market_universe.py src/avanza_mcp_adapter.py src/avanza_batch_quality.py src/swedish_stock_news.py scripts/avanza_mcp_bridge.py
      - name: Run offline validation tests
        run: python -m pytest --noconftest -q tests/test_swedish_market_scanner.py tests/test_swedish_market_universe.py tests/test_avanza_mcp_adapter.py tests/test_avanza_real_response_mapping.py tests/test_avanza_batch_quality.py tests/test_swedish_stock_news.py
