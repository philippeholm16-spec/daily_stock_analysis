name: Swedish scanner offline validation

on:
  push:
    branches:
      - feature/swedish-market-scanner
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install isolated test dependencies
        run: python -m pip install pytest
      - name: Compile scanner modules
        run: python -m py_compile src/swedish_market_scanner.py src/swedish_market_universe.py src/avanza_mcp_adapter.py src/avanza_batch_quality.py src/swedish_stock_news.py src/news_first_discovery.py src/swedish_news_sources.py src/news_headline_watchlist.py src/news_market_join.py src/news_company_research.py src/automatic_news_candidates.py src/technical_price_levels.py src/stockholm_stock_analyst.py src/stockholm_walkforward.py src/stockholm_realtime_quality.py src/ibkr_exchange_provenance.py src/stockholm_realtime_entry_recheck.py src/ibkr_tws_quote_adapter.py scripts/ibkr_local_live_probe.py src/stockholm_universe_batch.py src/discovery_watch_alerts.py src/news_source_diversity.py src/google_swedish_news.py src/complete_market_coverage.py src/proposal_independent_review.py src/research_alert_review.py src/telegram_research_digest.py scripts/telegram_research_delivery.py scripts/audit_stockholm_universe.py scripts/avanza_full_market.py scripts/stockholm_market_batch_research.py scripts/news_avanza_research_probe.py scripts/auto_news_research_probe.py scripts/avanza_mcp_bridge.py
      - name: Run offline validation tests
        run: python -m pytest --noconftest -q tests/test_swedish_market_scanner.py tests/test_swedish_market_universe.py tests/test_avanza_mcp_adapter.py tests/test_avanza_real_response_mapping.py tests/test_avanza_batch_quality.py tests/test_swedish_stock_news.py tests/test_news_first_discovery.py tests/test_swedish_news_sources.py tests/test_news_headline_watchlist.py tests/test_news_market_join.py tests/test_news_company_research.py tests/test_automatic_news_candidates.py tests/test_technical_price_levels.py tests/test_stockholm_stock_analyst.py tests/test_stockholm_walkforward.py tests/test_stockholm_realtime_quality.py tests/test_ibkr_exchange_provenance.py tests/test_stockholm_realtime_entry_recheck.py tests/test_stockholm_universe_batch.py tests/test_stockholm_market_batch_research.py tests/test_auto_news_research_integration.py tests/test_news_source_diversity.py tests/test_cash_and_risk_budget.py tests/test_google_swedish_news.py tests/test_complete_market_coverage.py tests/test_proposal_independent_review.py tests/test_research_alert_review.py tests/test_telegram_research_delivery.py tests/test_full_market_reference_requirement.py
